# nginx vhost for SadSha Build — served by the `web` service, which runs
# nginx from the same image as the `app` service (deploy/Dockerfile).
# php-fpm lives in the `app` container on the internal Docker network.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Plans / document uploads (project sheets, attachments). Laravel's own
    # upload limits still apply — this is only the proxy ceiling.
    client_max_body_size 50M;

    # Static assets: hashed Vite filenames, safe to cache hard. The PWA
    # service worker must never be cached or an old shell sticks around.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-store";
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Generous for large report / plan exports; the queue worker does the
        # truly heavy jobs, this only stops a slow export timing out at 60s.
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
